name: Release Please

on:
  push:
    branches: [main]

concurrency: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
