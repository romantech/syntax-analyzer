  "jotai-devtools@0.14.0>react-json-tree": "0.20.1"
  # shortcut: Workbox 7.4.1 still declares glob 11; remove when Workbox upgrades glob.
  "workbox-build@7.4.1>glob": "14.0.6"

allowBuilds:
  "@parcel/watcher": true
